<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethio Muslim</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#061b24;
  color:white;
}
header{
  text-align:center;
  padding:30px 15px;
  background:linear-gradient(160deg,#0b5263,#062630);
  border-radius:0 0 25px 25px;
}
.logo{font-size:50px}
h1{margin:5px}
.subtitle{color:#c8e8ed}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}
.card{
  background:#0c3541;
  border:1px solid #185565;
  border-radius:16px;
  padding:20px 10px;
  text-align:center;
}
.icon{font-size:35px;display:block;margin-bottom:8px}
.card-title{font-weight:bold;font-size:16px}
.card-sub{color:#9fc5cc;font-size:12px;margin-top:5px}
button{
  background:none;
  border:0;
  color:white;
  width:100%;
  font-size:inherit;
  cursor:pointer;
}
#quran{
  display:none;
  padding:20px;
}
.back{
  background:#0c3541;
  border:1px solid #185565;
  border-radius:12px;
  padding:12px 20px;
  color:white;
}
.juz{
  background:#0c3541;
  margin:8px 0;
  padding:15px;
  border-radius:12px;
  border:1px solid #185565;
}
.footer{
  text-align:center;
  padding:20px;
  color:#82aeb6;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">☪️</div>
  <h1>Ethio Muslim</h1>
  <p class="subtitle">Islamic App for Ethiopian Muslims</p>
</header>

<div id="home">
  <p style="padding:0 15px">Assalamu Alaikum 🤲</p>

  <div class="grid">

    <div class="card">
      <button onclick="openQuran()">
        <span class="icon">📖</span>
        <div class="card-title">Qur'an</div>
        <div class="card-sub">30 Juz</div>
      </button>
    </div>

    <div class="card">
      <span class="icon">🎧</span>
      <div class="card-title">Qur'an Audio</div>
      <div class="card-sub">Listen</div>
    </div>

    <div class="card">
      <span class="icon">🤲</span>
      <div class="card-title">Dua</div>
      <div class="card-sub">Daily Duas</div>
    </div>

    <div class="card">
      <span class="icon">📚</span>
      <div class="card-title">Hadith</div>
      <div class="card-sub">Hadith Collection</div>
    </div>

    <div class="card">
      <span class="icon">🕌</span>
      <div class="card-title">Prayer Times</div>
      <div class="card-sub">Daily Salah</div>
    </div>

    <div class="card">
      <span class="icon">🧭</span>
      <div class="card-title">Qibla</div>
      <div class="card-sub">Find Qibla</div>
    </div>

    <div class="card">
      <span class="icon">📿</span>
      <div class="card-title">Tasbih</div>
      <div class="card-sub">Digital Tasbih</div>
    </div>

    <div class="card">
      <span class="icon">🌙</span>
      <div class="card-title">Ramadan</div>
      <div class="card-sub">Ramadan Tools</div>
    </div>

  </div>

  <div class="footer">
    Ethio Muslim © 2026
  </div>
</div>

<div id="quran">
  <button class="back" onclick="closeQuran()">← Back</button>

  <h2>📖 Qur'an — 30 Juz</h2>
  <p>Choose a Juz</p>

  <div id="juzList"></div>
</div>

<script>
function openQuran(){
  document.getElementById("home").style.display="none";
  document.getElementById("quran").style.display="block";
}

function closeQuran(){
  document.getElementById("quran").style.display="none";
  document.getElementById("home").style.display="block";
}

const list=document.getElementById("juzList");

for(let i=1;i<=30;i++){
  const div=document.createElement("div");
  div.className="juz";
  div.innerHTML="📖 Juz "+i;
  list.appendChild(div);
}
</script>

</body>
</html>
