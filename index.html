<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethio Muslim</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#061b24;
  color:white;
}

header{
  text-align:center;
  padding:30px 15px;
  background:linear-gradient(160deg,#0b5263,#062630);
  border-radius:0 0 25px 25px;
}

.logo{font-size:50px}
h1{margin:5px}
.subtitle{color:#c8e8ed}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.card{
  background:#0c3541;
  border:1px solid #185565;
  border-radius:16px;
  padding:20px 10px;
  text-align:center;
}

.icon{
  font-size:35px;
  display:block;
  margin-bottom:8px;
}

.card-title{
  font-weight:bold;
  font-size:16px;
}

.card-sub{
  color:#9fc5cc;
  font-size:12px;
  margin-top:5px;
}

button{
  background:none;
  border:0;
  color:white;
  width:100%;
  font-size:inherit;
  cursor:pointer;
}

#quran{
  display:none;
  padding:20px;
}

.back{
  background:#0c3541;
  border:1px solid #185565;
  border-radius:12px;
  padding:12px 20px;
  color:white;
}

.juz{
  background:#0c3541;
  margin:8px 0;
  padding:15px;
  border-radius:12px;
  border:1px solid #185565;
  cursor:pointer;
}

#juzPage{
  display:none;
}

#juzContent{
  margin-top:15px;
}
-ayah{
  background:#0c3541;
  border:1px solid #185565;
  border-radius:15px;
  padding:18px;
  margin:10px 0;
  font-size:24px;
  line-height:2.2;
  text-align:right;
  direction:rtl;
}
.{
  color:#9fc5cc;
  font-size:14px;
  margin-top:8px;
  text-align:left;
  direction:ltr;
}

.loading{
  text-align:center;
  padding:30px;
  color:#9fc5cc;
}

.error{
  background:#5b2020;
  border:1px solid #a33;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.footer{
  text-align:center;
  padding:20px;
  color:#82aeb6;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">☪️</div>
  <h1>Ethio Muslim</h1>
  <p class="subtitle">Islamic App for Ethiopian Muslims</p>
</header>

<div id="home">

  <p style="padding:0 15px">
    Assalamu Alaikum 🤲
  </p>

  <div class="grid">

    <div class="card">
      <button onclick="openQuran()">
        <span class="icon">📖</span>
        <div class="card-title">Qur'an</div>
        <div class="card-sub">30 Juz</div>
      </button>
    </div>

    <div class="card">
      <span class="icon">🎧</span>
      <div class="card-title">Qur'an Audio</div>
      <div class="card-sub">Listen</div>
    </div>

    <div class="card">
      <span class="icon">🤲</span>
      <div class="card-title">Dua</div>
      <div class="card-sub">Daily Duas</div>
    </div>

    <div class="card">
      <span class="icon">📚</span>
      <div class="card-title">Hadith</div>
      <div class="card-sub">Hadith Collection</div>
    </div>

    <div class="card">
      <span class="icon">🕌</span>
      <div class="card-title">Prayer Times</div>
      <div class="card-sub">Daily Salah</div>
    </div>

    <div class="card">
      <span class="icon">🧭</span>
      <div class="card-title">Qibla</div>
      <div class="card-sub">Find Qibla</div>
    </div>

    <div class="card">
      <span class="icon">📿</span>
      <div class="card-title">Tasbih</div>
      <div class="card-sub">Digital Tasbih</div>
    </div>

    <div class="card">
      <span class="icon">🌙</span>
      <div class="card-title">Ramadan</div>
      <div class="card-sub">Ramadan Tools</div>
    </div>

  </div>

  <div class="footer">
    Ethio Muslim © 2026
  </div>

</div>


<div id="quran">

  <button class="back" onclick="closeQuran()">
    ← Back
  </button>

  <h2>📖 Qur'an — 30 Juz</h2>
  <p>Choose a Juz</p>

  <div id="juzList"></div>

  <div id="juzPage">

    <button class="back" onclick="closeJuz()">
      ← Back to Juz
    </button>

    <h2 id="juzTitle"></h2>

    <div id="juzContent"></div>

  </div>

</div>


<script>

function openQuran(){

  document.getElementById("home").style.display="none";

  document.getElementById("quran").style.display="block";

  document.getElementById("juzList").style.display="block";

  document.getElementById("juzPage").style.display="none";
}


function closeQuran(){

  document.getElementById("quran").style.display="none";

  document.getElementById("home").style.display="block";
}


function closeJuz(){

  document.getElementById("juzPage").style.display="none";

  document.getElementById("juzList").style.display="block";
}


async function openJuz(number){

  document.getElementById("juzList").style.display="none";

  document.getElementById("juzPage").style.display="block";

  document.getElementById("juzTitle").innerText =
    "📖 Qur'an — Juz " + number;

  const content=document.getElementById("juzContent");

  content.innerHTML=
    '<div class="loading">⏳ Qur’an እየጫነ ነው...</div>';

  try{

    const response=await fetch(
      "https://api.alquran.cloud/v1/juz/"
      +number+
      "/quran-uthmani"
    );

    if(!response.ok){
      throw new Error("Network error");
    }

    const result=await response.json();

    if(!result.data || !result.data.ayahs){
      throw new Error("Quran data not found");
    }

    content.innerHTML="";

    result.data.ayahs.forEach(function(ayah){

      const box=document.createElement("div");

      box.className="ayah";

      box.innerHTML=
        ayah.text+
        '<div class="ayah-number">'+
        ayah.surah.englishName+
        " — Ayah "+
        ayah.numberInSurah+
        "</div>";

      content.appendChild(box);

    });

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    content.innerHTML=
      '<div class="error">'+
      "❌ Qur'an መጫን አልተቻለም።<br><br>"+
      "ኢንተርኔትህን አረጋግጥና እንደገና ሞክር።"+
      "</div>";

  }

}


const list=document.getElementById("juzList");

for(let i=1;i<=30;i++){

  const div=document.createElement("div");

  div.className="juz";

  div.innerHTML="📖 Juz "+i;

  div.onclick=function(){

    openJuz(i);

  };

  list.appendChild(div);

}

</script>

</body>
</html>
