<script>

function openQuran(){
  document.getElementById("home").style.display="none";
  document.getElementById("quran").style.display="block";
  document.getElementById("juzList").style.display="block";
  document.getElementById("juzPage").style.display="none";
}

function closeQuran(){
  document.getElementById("quran").style.display="none";
  document.getElementById("home").style.display="block";
}

function closeJuz(){
  document.getElementById("juzPage").style.display="none";
  document.getElementById("juzList").style.display="block";
}

async function openJuz(number){

  document.getElementById("juzList").style.display="none";
  document.getElementById("juzPage").style.display="block";

  document.getElementById("juzTitle").innerText =
    "📖 Qur'an — Juz " + number;

  const content=document.getElementById("juzContent");

  content.innerHTML =
    '<div class="loading">⏳ Qur’an እየጫነ ነው...</div>';

  try{

    const response = await fetch(
      "https://api.alquran.cloud/v1/juz/" +
      number +
      "/quran-uthmani"
    );

    if(!response.ok){
      throw new Error("Network error");
    }

    const result = await response.json();

    if(!result.data || !result.data.ayahs){
      throw new Error("Quran data not found");
    }

    content.innerHTML="";

    result.data.ayahs.forEach(function(ayah){

      const box=document.createElement("div");

      box.className="ayah";

      box.innerHTML =
        ayah.text +
        '<div class="ayah-number">' +
        ayah.surah.englishName +
        " — Ayah " +
        ayah.numberInSurah +
        "</div>";

      content.appendChild(box);

    });

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }catch(error){

    content.innerHTML =
      '<div class="error">' +
      "❌ Qur'an መጫን አልተቻለም።<br><br>" +
      "ኢንተርኔትህን አረጋግጥና እንደገና ሞክር።" +
      "</div>";

  }
}

const list=document.getElementById("juzList");

for(let i=1; i<=30; i++){

  const div=document.createElement("div");

  div.className="juz";

  div.innerHTML="📖 Juz " + i;

  div.onclick=function(){
    openJuz(i);
  };

  list.appendChild(div);
}

</script>
